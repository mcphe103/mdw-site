name: Import approved portfolio captures

on:
  push:
    branches:
      - feature/neon-precision-integration
    paths:
      - .github/workflows/import-portfolio-captures.yml

permissions:
  contents: write

jobs:
  import-captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/neon-precision-integration

      - name: Download approved source captures
        run: |
          mkdir -p public/projects/chairez-fencing public/projects/sweet-x-indulgence
          curl --fail --location --silent --show-error https://mcpherson-digital-works-redesign-v2.vercel.app/projects/chairez-fencing/desktop-home.png --output public/projects/chairez-fencing/desktop-home.png
          curl --fail --location --silent --show-error https://mcpherson-digital-works-redesign-v2.vercel.app/projects/chairez-fencing/mobile-home.jpg --output public/projects/chairez-fencing/mobile-home.jpg
          curl --fail --location --silent --show-error https://mcpherson-digital-works-redesign-v2.vercel.app/projects/sweet-x-indulgence/desktop-home.png --output public/projects/sweet-x-indulgence/desktop-home.png
          curl --fail --location --silent --show-error https://mcpherson-digital-works-redesign-v2.vercel.app/projects/sweet-x-indulgence/mobile-home.jpg --output public/projects/sweet-x-indulgence/mobile-home.jpg

      - name: Verify donor blob hashes
        run: |
          test "$(git hash-object public/projects/chairez-fencing/desktop-home.png)" = cadf4253d98923122a61996405f22ea23ad72445
          test "$(git hash-object public/projects/chairez-fencing/mobile-home.jpg)" = 1e74d392d39b6922fbf4b4093426954a7648c764
          test "$(git hash-object public/projects/sweet-x-indulgence/desktop-home.png)" = 2899f82b713227cfbe3d16659ea7246904a4a573
          test "$(git hash-object public/projects/sweet-x-indulgence/mobile-home.jpg)" = 0f065c27ccd0807d5ca68cfb4c80cca061c70702

      - name: Commit verified captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects
          git rm .github/workflows/import-portfolio-captures.yml
          git commit -m "chore: import approved portfolio captures"
          git push origin HEAD:feature/neon-precision-integration
